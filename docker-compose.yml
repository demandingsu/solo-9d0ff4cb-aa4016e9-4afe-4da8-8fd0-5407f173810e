services:
  # 本地示例站：虚构的招标公告目录，含分页、详情、坏链等离线演示数据
  example-site:
    build:
      context: ./example-site
    image: supplier-normalizer-example-site:latest
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/list/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 供应商归一核对页（纯标准库实现，无第三方依赖）
  normalizer:
    build:
      context: .
    image: supplier-normalizer:latest
    ports:
      - "8000:8000"
    depends_on:
      example-site:
        condition: service_healthy
