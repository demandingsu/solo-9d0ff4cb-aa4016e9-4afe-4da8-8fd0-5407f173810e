server {
    listen       80;
    server_name  example-site.local;

    root   /usr/share/nginx/html;
    index  index.html;

    # 示例：目录里挂了一条已下线公告，访问返回 404，
    # 抓取器应把它登记为失败并提示“名录可能不完整”
    location /detail/missing-ann06.html {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
